[package]
name = "ssids-cli"
description = "Headless ssids: scan from the terminal and record scans for replay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ssids"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = { workspace = true }
ssids-adapter-nl80211 = { workspace = true }
ssids-app = { workspace = true }
ssids-domain = { workspace = true }
