[package]
name = "ssids-cli"
description = "Headless ssids: scan from the terminal, record scans for replay, serve them to the browser UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ssids"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = { workspace = true }
ssids-adapter-nl80211 = { workspace = true }
ssids-app = { workspace = true }
ssids-domain = { workspace = true }
# 0.24 is what ewebsock (the remote client) uses: one WebSocket stack in the tree.
tungstenite = "0.24"

[dev-dependencies]
ssids-adapter-remote = { workspace = true }
