[package]
name = "ssids-adapter-nl80211"
description = "Linux ScanSource: reads nl80211 (generic netlink) directly, triggers scans via nl80211 or NetworkManager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ssids-app = { workspace = true }
ssids-domain = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-sys = { version = "0.9", default-features = false }
zbus = "5"
