[package]
name = "ssids-ui"
description = "The ssids graphical interface (egui): native and WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "ssids-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
eframe = "0.36"
egui_extras = { version = "0.36", default-features = false }
egui_plot = "0.37"
ssids-adapter-remote = { workspace = true }
ssids-adapter-replay = { workspace = true }
ssids-app = { workspace = true }
ssids-domain = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ssids-adapter-nl80211 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
log = "0.4"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Location", "Url", "UrlSearchParams"] }
